version: "3.8"

networks:
  gateway_net:
    driver: overlay
  db_net:
    driver: overlay
    internal: true
  cache_net:
    driver: overlay
    internal: true
  message_queue_net:
    driver: overlay
    internal: true
  auth_net:
    driver: overlay
    internal: true
  monitoring_net:
    driver: overlay
    internal: true

volumes:
  db_data:
  db_replica_data:
  keycloak_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "Password2024!"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "safecampus"
      MYSQL_REPLICATION_USER: "replicator"
      MYSQL_REPLICATION_PASSWORD: "ReplicaSync2024!"
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  db_replica:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "Password2024!"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "safecampus"
      MYSQL_REPLICATION_USER: "replicator"
      MYSQL_REPLICATION_PASSWORD: "ReplicaSync2024!"
    command:
      - --server-id=2
      - --relay-log=relay-log
      - --relay-log-index=relay-log.index
    volumes:
      - db_replica_data:/var/lib/mysql
      - ./mysql/db-replica-init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_net
    depends_on:
      - db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_HOSTNAME_URL: "http://localhost:8000/auth"
      KC_HOSTNAME_ADMIN_URL: "http://localhost:8000/auth"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: "xforwarded"
      KC_PROXY: "edge"
      KC_HTTP_RELATIVE_PATH: "/auth"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ${PWD}/keycloak/safecampus-realm.json:/opt/keycloak/data/import/safecampus-realm.json:ro
    expose:
      - "8080"
    networks:
      - gateway_net
      - auth_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  kong:
    image: kong:3.6-ubuntu
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ${PWD}/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
      - target: 8001
        published: 8001
        protocol: tcp
        mode: host
    networks:
      - gateway_net
    depends_on:
      - backend
      - keycloak
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - db_net
    deploy:
      replicas: 1

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - cache_net
      - db_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - message_queue_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - message_queue_net
    depends_on:
      - zookeeper
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: host
    networks:
      - gateway_net
      - monitoring_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/safecampus.json:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports:
      - target: 3000
        published: 3010
        protocol: tcp
        mode: host
    networks:
      - gateway_net
      - monitoring_net
    depends_on:
      - prometheus
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: safecampus_backend:latest
    environment:
      PORT: "3001"
      DATABASE_URL: "mysql://root:Password2024!@db:3306/safecampus"
      DATABASE_URL_REPLICA: "mysql://root:Password2024!@db_replica:3306/safecampus"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_CLIENT_ID: "safecampus-backend"
      KAFKA_GROUP_ID: "safecampus-alertss"
      KEYCLOAK_AUTH_URL: "http://localhost:8000/auth"
      KEYCLOAK_REALM: "safecampus"
      KEYCLOAK_CLIENT_ID: "safecampus-backend"
      KEYCLOAK_BEARER_ONLY: "true"
      KEYCLOAK_REALM_PUBLIC_KEY: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3001"
    networks:
      - gateway_net
      - db_net
      - cache_net
      - message_queue_net
      - auth_net
      - monitoring_net
    depends_on:
      - db
      - keycloak
      - kafka
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  frontend:
    image: safecampus_frontend:latest
    command: npm run dev
    environment:
      NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost:8000/auth" 
      NEXT_PUBLIC_KEYCLOAK_REALM: "safecampus"
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "safecampus-frontend"
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api" 
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    networks:
      - gateway_net
    depends_on:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
